<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050711"><title>NEXA Player</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visualizer-expansion.css"><link rel="stylesheet" href="theme-color.css"><link rel="stylesheet" href="playlist-picker.css"><link rel="stylesheet" href="album-covers.css"></head><body><div class="app"><header class="topbar"><div class="brand"><div class="brand-mark"></div><span>NEXA PLAYER</span></div><div id="topNowPlaying" class="top-now-playing" aria-live="polite"><span>NOW PLAYING</span><b id="topNowTitle">Nessun brano</b></div><div class="status">● OFFLINE MODE</div></header><main id="view"></main></div><button id="returnHome" class="return-home" type="button" aria-label="Torna alla Home">⌂ <span>Torna alla Home</span></button><nav class="nav" aria-label="NEXA navigation"><button data-page="home"><span class="ico">⌂</span>Home</button><button data-page="tracks"><span class="ico">♫</span>Brani</button><button data-page="favorites"><span class="ico">♥</span>Preferiti</button><button data-page="playlists"><span class="ico">☷</span>Playlist</button><button data-page="profile"><span class="ico">●</span>Profilo</button><button data-page="settings"><span class="ico">⚙</span>Impostazioni</button></nav><div id="player" class="player"><div id="playerCover" class="player-cover">♫</div><div class="player-info"><b id="playerTitle">Nessun brano</b><span id="playerArtist">Seleziona una canzone</span></div><button id="prevBtn" class="player-btn">⏮</button><button id="playerPlay" class="player-btn">▶</button><button id="nextBtn" class="player-btn">⏭</button><button id="shuffleBtn" class="player-btn">⤨</button><button id="repeatBtn" class="player-btn">↻</button><button id="queueBtn" class="player-btn" aria-label="Coda">☷</button><button id="cinemaOpen" class="player-btn">◉</button></div><div id="cinema" class="cinema"><canvas id="visualizer"></canvas><div class="cinema-glow"></div><div class="cinema-info"><div id="cinemaTitle">NEXA MUSIC CINEMA</div><button id="cinemaPlay" class="player-btn">▶</button><button id="cinemaExit" class="player-btn">×</button></div></div><div id="modal" class="modal"><div class="sheet"><div class="section-title"><h2>Profilo</h2><span>LOCAL</span></div><input id="nameInput" placeholder="Nome visualizzato"><div class="actions"><button id="closeModal">Annulla</button><button id="saveName" class="primary">Salva</button></div></div></div><audio id="audio" preload="auto" playsinline></audio><script src="audio-engine.js"></script><script src="app.js"></script></body></html>
